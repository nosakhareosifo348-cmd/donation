services:
  - type: web
    name: givehope-backend
    env: node
    region: oregon
    plan: free
    rootDir: donation_backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://www.givehope.it.com
